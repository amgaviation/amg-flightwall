name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  host-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build and test portable core
        run: ./scripts/check.sh

      - name: Upload simulator frames
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: simulator-frames
          path: build/host/artifacts/*.ppm
          if-no-files-found: error
          retention-days: 7

  embedded-target:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned PlatformIO
        run: python -m pip install -r tools/requirements-build.txt

      - name: Build HD-WF2 target without uploading
        run: ./scripts/build.sh hd-wf2

      - name: Verify device-write safety gate
        run: |
          for blocked_target in upload uploadfs program erase; do
            if pio run --project-dir firmware/amg-flightwall --environment hd_wf2_build_only --target "$blocked_target" --upload-port /dev/null; then
              echo "safety gate unexpectedly allowed $blocked_target" >&2
              exit 1
            fi
          done
