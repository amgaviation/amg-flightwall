[platformio]
default_envs = hd_wf2_build_only
src_dir = .
include_dir = include

[env:hd_wf2_build_only]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = targets/hd-wf2/partitions.csv
build_unflags =
  -std=gnu++11
  -DBOARD_HAS_PSRAM
build_flags =
  -std=gnu++17
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DNO_GFX
build_src_flags =
  -Wall
  -Wextra
  -Werror
build_src_filter =
  +<src/*.cpp>
  +<targets/hd-wf2/*.cpp>
  -<simulator/>
  -<tests/>
extra_scripts = pre:targets/hd-wf2/safety_gate.py
lib_deps =
  https://github.com/mrfaptastic/ESP32-HUB75-MatrixPanel-DMA.git#f17fb7fe9d487e9643f919eb5aeedea8d9d1f8d7
